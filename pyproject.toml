[project]
name = "kittylog"
version = "0.1.0"
description = "Backend API for cat parents to manage everything about their cats' lives"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.0.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.0",
    "python-json-logger>=2.0.0",
    "apscheduler>=3.10.0",
    "itsdangerous>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
